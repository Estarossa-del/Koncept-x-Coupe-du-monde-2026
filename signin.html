<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONCEPT · Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/three@0.169.0/build/three.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;background:#000;color:#fff;font-family:'Inter',sans-serif;overflow-x:hidden}

/* ── Transitions de page ── */
.step-enter{animation:stepIn 0.4s ease both}
.step-exit{animation:stepOut 0.4s ease both}
@keyframes stepIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes stepOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-24px)}}
.step-enter-left{animation:stepInLeft 0.4s ease both}
.step-exit-left{animation:stepOutLeft 0.4s ease both}
@keyframes stepInLeft{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
@keyframes stepOutLeft{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-60px)}}
.step-enter-right{animation:stepInRight 0.4s ease both}
@keyframes stepInRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}

/* ── Inputs ── */
.signin-input{
  width:100%;background:rgba(255,255,255,0.05);
  color:#fff;border:1px solid rgba(255,255,255,0.12);
  border-radius:9999px;padding:12px 16px;
  font-size:14px;font-family:'Inter',sans-serif;
  outline:none;text-align:center;
  transition:border-color 0.2s;
}
.signin-input:focus{border-color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.07)}
.signin-input::placeholder{color:rgba(255,255,255,0.3)}

/* ── Buttons ── */
.btn-white{
  background:#fff;color:#000;font-weight:600;
  border:none;border-radius:9999px;padding:12px 24px;
  cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;
  transition:background 0.2s,transform 0.15s;
}
.btn-white:hover{background:rgba(255,255,255,0.9);transform:translateY(-1px)}
.btn-white:active{transform:scale(0.98)}
.btn-ghost{
  background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.6);
  border:1px solid rgba(255,255,255,0.12);border-radius:9999px;
  padding:12px 24px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;
  transition:all 0.2s;
}
.btn-ghost:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);color:#fff}
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,255,255,0.05);color:#fff;
  border:1px solid rgba(255,255,255,0.12);border-radius:9999px;
  padding:12px 16px;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;
  transition:background 0.2s;backdrop-filter:blur(2px);
}
.btn-google:hover{background:rgba(255,255,255,0.1)}

/* ── Code inputs ── */
.code-box{
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.12);border-radius:9999px;
  padding:14px 20px;gap:0;background:transparent;
}
.code-digit{
  position:relative;width:36px;text-align:center;
}
.code-digit input{
  width:36px;text-align:center;font-size:20px;font-weight:300;
  background:transparent;color:#fff;border:none;
  outline:none;caret-color:transparent;
  font-family:'Inter',sans-serif;
}
.code-digit-placeholder{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;pointer-events:none;font-weight:300;
}
.code-sep{color:rgba(255,255,255,0.2);font-size:18px;user-select:none}

/* ── Navbar ── */
.mini-nav{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  z-index:50;display:flex;flex-direction:column;align-items:center;
  padding:12px 24px;border-radius:9999px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(31,31,31,0.55);backdrop-filter:blur(12px);
  width:calc(100% - 2rem);max-width:600px;
  transition:border-radius 0.3s;
}
.mini-nav.open{border-radius:16px}
.mini-nav-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:24px}
.nav-logo-dots{position:relative;width:20px;height:20px;flex-shrink:0}
.nav-logo-dots span{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(210,210,210,0.85)}
.nav-logo-dots span:nth-child(1){top:0;left:50%;transform:translateX(-50%)}
.nav-logo-dots span:nth-child(2){top:50%;left:0;transform:translateY(-50%)}
.nav-logo-dots span:nth-child(3){top:50%;right:0;transform:translateY(-50%)}
.nav-logo-dots span:nth-child(4){bottom:0;left:50%;transform:translateX(-50%)}
.nav-links-desktop{display:flex;align-items:center;gap:24px}
@media(max-width:640px){.nav-links-desktop,.nav-btns-desktop{display:none}}
.nav-link-animated{position:relative;display:inline-flex;align-items:center;height:20px;overflow:hidden;font-size:13px;color:rgba(200,200,200,0.8);text-decoration:none}
.nav-link-inner{display:flex;flex-direction:column;transition:transform 0.35s ease}
.nav-link-animated:hover .nav-link-inner{transform:translateY(-50%)}
.nav-link-span-default{color:rgba(200,200,200,0.75)}
.nav-link-span-hover{color:#fff}
.nav-btns-desktop{display:flex;align-items:center;gap:8px}
.nav-btn-login{
  padding:6px 14px;font-size:12px;border:1px solid rgba(80,80,80,0.8);
  background:rgba(31,31,31,0.62);color:rgba(200,200,200,0.85);border-radius:9999px;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;
}
.nav-btn-login:hover{border-color:rgba(255,255,255,0.5);color:#fff}
.nav-btn-signup{
  position:relative;padding:6px 14px;font-size:12px;font-weight:600;
  color:#000;border:none;border-radius:9999px;cursor:pointer;
  background:linear-gradient(145deg,#e8e8e8,#c8c8c8);font-family:'Inter',sans-serif;
  transition:all 0.2s;
}
.nav-btn-signup:hover{background:linear-gradient(145deg,#f0f0f0,#d8d8d8)}
.nav-burger{display:none;background:transparent;border:none;color:rgba(200,200,200,0.8);cursor:pointer;padding:4px}
@media(max-width:640px){.nav-burger{display:flex;align-items:center;justify-content:center;width:32px;height:32px}}
.nav-mobile{
  width:100%;overflow:hidden;
  max-height:0;opacity:0;pointer-events:none;
  transition:max-height 0.3s ease,opacity 0.3s ease,padding 0.3s ease;
}
.nav-mobile.open{max-height:400px;opacity:1;pointer-events:auto;padding-top:16px}
.nav-mobile-links{display:flex;flex-direction:column;align-items:center;gap:16px;font-size:15px}
.nav-mobile-links a{color:rgba(200,200,200,0.8);text-decoration:none;width:100%;text-align:center}
.nav-mobile-links a:hover{color:#fff}
.nav-mobile-btns{display:flex;flex-direction:column;gap:12px;margin-top:16px;width:100%}

/* ── Divider ── */
.divider{display:flex;align-items:center;gap:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1)}
.divider span{color:rgba(255,255,255,0.35);font-size:12px}

/* ── Success animation ── */
@keyframes scaleIn{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:scale(1)}}
.success-icon{animation:scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.3s both}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.success-btn{animation:fadeInUp 0.4s ease 0.9s both}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── DotMatrixCanvas — Three.js adaptation de CanvasRevealEffect ── */
const DotMatrixCanvas = ({ reverse = false, colors = [[255,255,255]], dotSize = 6 }) => {
  const mountRef = useRef(null);

  useEffect(() => {
    const el = mountRef.current;
    if (!el || !window.THREE) return;
    const T = window.THREE;

    const W = el.clientWidth;
    const H = el.clientHeight;

    const scene = new T.Scene();
    const camera = new T.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
    camera.position.z = 1;

    const renderer = new T.WebGLRenderer({ alpha: true, antialias: false });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    el.appendChild(renderer.domElement);
    Object.assign(renderer.domElement.style, {
      position: 'absolute', inset: 0, width: '100%', height: '100%'
    });

    // Colors: fill 6 slots
    const c = colors;
    let ca = [c[0],c[0],c[0],c[0],c[0],c[0]];
    if (c.length === 2) ca = [c[0],c[0],c[0],c[1],c[1],c[1]];
    if (c.length >= 3) ca = [c[0],c[0],c[1],c[1],c[2],c[2]];
    const colVec = ca.map(col => new T.Vector3(col[0]/255, col[1]/255, col[2]/255));

    const material = new T.ShaderMaterial({
      vertexShader: `
        precision mediump float;
        uniform vec2 u_resolution;
        out vec2 fragCoord;
        void main(){
          gl_Position = vec4(position.xy, 0.0, 1.0);
          fragCoord = (position.xy + vec2(1.0)) * 0.5 * u_resolution;
          fragCoord.y = u_resolution.y - fragCoord.y;
        }
      `,
      fragmentShader: `
        precision mediump float;
        in vec2 fragCoord;
        uniform float u_time;
        uniform float u_opacities[10];
        uniform vec3 u_colors[6];
        uniform float u_total_size;
        uniform float u_dot_size;
        uniform vec2 u_resolution;
        uniform int u_reverse;
        out vec4 fragColor;

        float PHI = 1.61803398874989484820459;
        float random(vec2 xy){
          return fract(tan(distance(xy * PHI, xy) * 0.5) * xy.x);
        }

        void main(){
          vec2 st = fragCoord.xy;
          st.x -= abs(floor((mod(u_resolution.x, u_total_size) - u_dot_size) * 0.5));
          st.y -= abs(floor((mod(u_resolution.y, u_total_size) - u_dot_size) * 0.5));

          float opacity = step(0.0, st.x) * step(0.0, st.y);
          vec2 st2 = vec2(int(st.x / u_total_size), int(st.y / u_total_size));

          float frequency = 5.0;
          float show_offset = random(st2);
          float rand = random(st2 * floor((u_time / frequency) + show_offset + frequency));
          opacity *= u_opacities[int(rand * 10.0)];
          opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.x / u_total_size));
          opacity *= 1.0 - step(u_dot_size / u_total_size, fract(st.y / u_total_size));

          vec3 color = u_colors[int(show_offset * 6.0)];

          float spd = 0.5;
          vec2 cg = u_resolution / 2.0 / u_total_size;
          float dist = distance(cg, st2);
          float maxDist = distance(cg, vec2(0.0));
          float offIntro = dist * 0.01 + random(st2) * 0.15;
          float offOutro = (maxDist - dist) * 0.02 + random(st2 + 42.0) * 0.2;
          float t = u_time * spd;

          if (u_reverse == 1){
            opacity *= 1.0 - step(offOutro, t);
            opacity *= clamp(step(offOutro + 0.1, t) * 1.25, 1.0, 1.25);
          } else {
            opacity *= step(offIntro, t);
            opacity *= clamp((1.0 - step(offIntro + 0.1, t)) * 1.25, 1.0, 1.25);
          }

          fragColor = vec4(color, opacity);
          fragColor.rgb *= fragColor.a;
        }
      `,
      uniforms: {
        u_time:       { value: 0 },
        u_colors:     { value: colVec },
        u_opacities:  { value: [0.3,0.3,0.3,0.5,0.5,0.5,0.8,0.8,0.8,1.0] },
        u_total_size: { value: 20 },
        u_dot_size:   { value: dotSize },
        u_resolution: { value: new T.Vector2(W * 2, H * 2) },
        u_reverse:    { value: reverse ? 1 : 0 },
      },
      glslVersion: T.GLSL3,
      blending: T.CustomBlending,
      blendSrc: T.SrcAlphaFactor,
      blendDst: T.OneFactor,
      transparent: true,
    });

    const mesh = new T.Mesh(new T.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    const clock = new T.Clock();
    let rafId;
    const tick = () => {
      rafId = requestAnimationFrame(tick);
      material.uniforms.u_time.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    };
    tick();

    const onResize = () => {
      const nw = el.clientWidth, nh = el.clientHeight;
      renderer.setSize(nw, nh);
      material.uniforms.u_resolution.value = new T.Vector2(nw * 2, nh * 2);
    };
    window.addEventListener('resize', onResize);

    return () => {
      cancelAnimationFrame(rafId);
      window.removeEventListener('resize', onResize);
      material.dispose();
      renderer.dispose();
      if (el && renderer.domElement.parentNode === el) el.removeChild(renderer.domElement);
    };
  }, [reverse]);

  return (
    <div ref={mountRef} style={{
      position: 'absolute', inset: 0, width: '100%', height: '100%', overflow: 'hidden'
    }} />
  );
};

/* ── MiniNavbar ── */
const MiniNavbar = () => {
  const [open, setOpen] = useState(false);
  const links = [
    { label: 'Site principal', href: 'index.html' },
    { label: 'Pronostics', href: 'index.html#pronostics' },
    { label: 'Classement', href: 'index.html#classement' },
  ];
  return (
    <header className={`mini-nav${open ? ' open' : ''}`}>
      <div className="mini-nav-row">
        <a href="index.html" style={{ textDecoration: 'none' }}>
          <div className="nav-logo-dots">
            <span/><span/><span/><span/>
          </div>
        </a>
        <nav className="nav-links-desktop">
          {links.map(l => (
            <a key={l.href} href={l.href} className="nav-link-animated">
              <div className="nav-link-inner">
                <span className="nav-link-span-default">{l.label}</span>
                <span className="nav-link-span-hover">{l.label}</span>
              </div>
            </a>
          ))}
        </nav>
        <div className="nav-btns-desktop">
          <button className="nav-btn-login" onClick={() => window.location.href='index.html'}>Retour</button>
          <button className="nav-btn-signup">KONCEPT</button>
        </div>
        <button className="nav-burger" onClick={() => setOpen(!open)} aria-label="Menu">
          {open
            ? <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
            : <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          }
        </button>
      </div>
      <div className={`nav-mobile${open ? ' open' : ''}`}>
        <nav className="nav-mobile-links">
          {links.map(l => <a key={l.href} href={l.href}>{l.label}</a>)}
        </nav>
        <div className="nav-mobile-btns">
          <button className="nav-btn-login" style={{ width: '100%', padding: '10px' }} onClick={() => window.location.href='index.html'}>Retour au site</button>
          <button className="nav-btn-signup" style={{ width: '100%', padding: '10px' }}>KONCEPT</button>
        </div>
      </div>
    </header>
  );
};

/* ── StepEmail ── */
const StepEmail = ({ onSubmit }) => {
  const [email, setEmail] = useState('');
  return (
    <div className="step-enter" style={{ textAlign: 'center' }}>
      <div style={{ marginBottom: 28 }}>
        <h1 style={{ fontSize: 'clamp(2rem,5vw,2.6rem)', fontWeight: 700, lineHeight: 1.1, letterSpacing: '-0.02em', color: '#fff', marginBottom: 8 }}>
          Bienvenue<br/>sur KONCEPT
        </h1>
        <p style={{ fontSize: '1.1rem', color: 'rgba(255,255,255,0.5)', fontWeight: 300 }}>
          Votre espace pronostics CDM 2026
        </p>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <button className="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continuer avec Google
        </button>

        <div className="divider"><span>ou</span></div>

        <form onSubmit={e => { e.preventDefault(); if (email) onSubmit(email); }} style={{ position: 'relative' }}>
          <input
            type="email" placeholder="votre@email.com" value={email}
            onChange={e => setEmail(e.target.value)}
            className="signin-input" required
            style={{ paddingRight: 52 }}
          />
          <button type="submit" style={{
            position: 'absolute', right: 6, top: '50%', transform: 'translateY(-50%)',
            width: 36, height: 36, borderRadius: '50%',
            background: 'rgba(255,255,255,0.1)', border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: '#fff', fontSize: 16, transition: 'background 0.2s',
          }}
            onMouseOver={e => e.currentTarget.style.background = 'rgba(255,255,255,0.2)'}
            onMouseOut={e => e.currentTarget.style.background = 'rgba(255,255,255,0.1)'}
          >→</button>
        </form>
      </div>

      <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', marginTop: 40, lineHeight: 1.7 }}>
        En vous inscrivant, vous acceptez les{' '}
        <a href="#" style={{ color: 'rgba(255,255,255,0.4)', textDecoration: 'underline' }}>CGU</a>,{' '}
        <a href="#" style={{ color: 'rgba(255,255,255,0.4)', textDecoration: 'underline' }}>Politique de confidentialité</a>{' '}
        et les <a href="#" style={{ color: 'rgba(255,255,255,0.4)', textDecoration: 'underline' }}>Cookies</a>.
      </p>
    </div>
  );
};

/* ── StepCode ── */
const StepCode = ({ email, onComplete, onBack }) => {
  const [code, setCode] = useState(['', '', '', '', '', '']);
  const refs = useRef([]);

  useEffect(() => { setTimeout(() => refs.current[0]?.focus(), 400); }, []);

  const handleChange = (i, val) => {
    if (!/^\d?$/.test(val)) return;
    const next = [...code];
    next[i] = val;
    setCode(next);
    if (val && i < 5) refs.current[i + 1]?.focus();
    if (i === 5 && val && next.every(d => d)) onComplete();
  };

  const handleKey = (i, e) => {
    if (e.key === 'Backspace' && !code[i] && i > 0) refs.current[i - 1]?.focus();
  };

  const isComplete = code.every(d => d);

  return (
    <div className="step-enter-right" style={{ textAlign: 'center' }}>
      <div style={{ marginBottom: 28 }}>
        <h1 style={{ fontSize: 'clamp(1.8rem,4.5vw,2.4rem)', fontWeight: 700, lineHeight: 1.1, letterSpacing: '-0.02em', color: '#fff', marginBottom: 8 }}>
          Code envoyé
        </h1>
        <p style={{ fontSize: '1rem', color: 'rgba(255,255,255,0.45)', fontWeight: 300 }}>
          Vérifiez votre boîte — <span style={{ color: 'rgba(255,255,255,0.65)' }}>{email}</span>
        </p>
      </div>

      <div style={{ marginBottom: 20 }}>
        <div className="code-box">
          {code.map((digit, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center' }}>
              <div className="code-digit">
                <input
                  ref={el => refs.current[i] = el}
                  type="text" inputMode="numeric" pattern="[0-9]*"
                  maxLength={1} value={digit}
                  onChange={e => handleChange(i, e.target.value)}
                  onKeyDown={e => handleKey(i, e)}
                />
                {!digit && <div className="code-digit-placeholder">0</div>}
              </div>
              {i < 5 && <span className="code-sep">|</span>}
            </div>
          ))}
        </div>
      </div>

      <p
        style={{ fontSize: 13, color: 'rgba(255,255,255,0.4)', cursor: 'pointer', marginBottom: 28, transition: 'color 0.2s' }}
        onMouseOver={e => e.currentTarget.style.color = 'rgba(255,255,255,0.7)'}
        onMouseOut={e => e.currentTarget.style.color = 'rgba(255,255,255,0.4)'}
      >
        Renvoyer le code
      </p>

      <div style={{ display: 'flex', gap: 10 }}>
        <button className="btn-white" style={{ width: '30%', padding: '12px 0' }} onClick={onBack}>
          ←
        </button>
        <button
          className={isComplete ? 'btn-white' : 'btn-ghost'}
          style={{ flex: 1, cursor: isComplete ? 'pointer' : 'not-allowed', opacity: isComplete ? 1 : 0.5 }}
          disabled={!isComplete}
          onClick={isComplete ? onComplete : undefined}
        >
          Continuer
        </button>
      </div>

      <p style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', marginTop: 36, lineHeight: 1.7 }}>
        En vous inscrivant, vous acceptez les{' '}
        <a href="#" style={{ color: 'rgba(255,255,255,0.4)', textDecoration: 'underline' }}>CGU</a>{' '}
        et la <a href="#" style={{ color: 'rgba(255,255,255,0.4)', textDecoration: 'underline' }}>Politique de confidentialité</a>.
      </p>
    </div>
  );
};

/* ── StepSuccess ── */
const StepSuccess = () => (
  <div className="step-enter" style={{ textAlign: 'center' }}>
    <div style={{ marginBottom: 28 }}>
      <h1 style={{ fontSize: 'clamp(1.8rem,4.5vw,2.4rem)', fontWeight: 700, lineHeight: 1.1, letterSpacing: '-0.02em', color: '#fff', marginBottom: 8 }}>
        Vous êtes dedans !
      </h1>
      <p style={{ fontSize: '1rem', color: 'rgba(255,255,255,0.45)', fontWeight: 300 }}>
        Bienvenue dans la compétition KONCEPT
      </p>
    </div>

    <div style={{ padding: '36px 0' }}>
      <div className="success-icon" style={{
        margin: '0 auto', width: 64, height: 64, borderRadius: '50%',
        background: 'linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        boxShadow: '0 0 40px rgba(255,255,255,0.3)',
      }}>
        <svg width="32" height="32" viewBox="0 0 20 20" fill="none">
          <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill="#000" clipRule="evenodd"/>
        </svg>
      </div>
      <p style={{ marginTop: 20, fontSize: 13, color: 'rgba(255,255,255,0.4)' }}>
        🏆 Vous débutez avec le Ballon Papier 📄 — visez le Diamant 💎 !
      </p>
    </div>

    <button
      className="btn-white success-btn"
      style={{ width: '100%' }}
      onClick={() => window.location.href = 'index.html'}
    >
      Aller sur le site →
    </button>
  </div>
);

/* ── SignInPage ── */
const SignInPage = () => {
  const [step, setStep] = useState('email'); // 'email' | 'code' | 'success'
  const [email, setEmail] = useState('');
  const [showReverse, setShowReverse] = useState(false);
  const [showForward, setShowForward] = useState(true);

  const handleEmailSubmit = (em) => {
    setEmail(em);
    setStep('code');
  };

  const handleCodeComplete = () => {
    setShowReverse(true);
    setTimeout(() => setShowForward(false), 50);
    setTimeout(() => setStep('success'), 2000);
  };

  const handleBack = () => {
    setStep('email');
    setShowReverse(false);
    setShowForward(true);
  };

  return (
    <div style={{ position: 'relative', minHeight: '100vh', background: '#000', display: 'flex', flexDirection: 'column' }}>

      {/* Canvas background */}
      <div style={{ position: 'absolute', inset: 0, zIndex: 0 }}>
        {showForward && (
          <DotMatrixCanvas reverse={false} colors={[[255,255,255],[255,255,255]]} dotSize={6} />
        )}
        {showReverse && (
          <DotMatrixCanvas reverse={true} colors={[[255,255,255],[255,255,255]]} dotSize={6} />
        )}
        {/* Radial vignette */}
        <div style={{
          position: 'absolute', inset: 0,
          background: 'radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,0,0,0.85) 0%, transparent 100%)',
          pointerEvents: 'none',
        }} />
        {/* Top fade */}
        <div style={{
          position: 'absolute', top: 0, left: 0, right: 0, height: '35%',
          background: 'linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%)',
          pointerEvents: 'none',
        }} />
        {/* Bottom fade */}
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0, height: '25%',
          background: 'linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%)',
          pointerEvents: 'none',
        }} />
      </div>

      {/* Navbar */}
      <div style={{ position: 'relative', zIndex: 10 }}>
        <MiniNavbar />
      </div>

      {/* Form area */}
      <div style={{
        position: 'relative', zIndex: 10, flex: 1,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: '120px 24px 60px',
      }}>
        <div style={{ width: '100%', maxWidth: 380 }}>
          {step === 'email' && (
            <StepEmail key="email" onSubmit={handleEmailSubmit} />
          )}
          {step === 'code' && (
            <StepCode key="code" email={email} onComplete={handleCodeComplete} onBack={handleBack} />
          )}
          {step === 'success' && (
            <StepSuccess key="success" />
          )}
        </div>
      </div>

      {/* Footer hint */}
      <div style={{
        position: 'relative', zIndex: 10,
        textAlign: 'center', padding: '0 24px 32px',
        fontSize: 11, color: 'rgba(255,255,255,0.2)',
      }}>
        KONCEPT × CDM 2026 · 48 nations · 104 matchs
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<SignInPage />);
</script>
</body>
</html>
